<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Browser License Plate Detection</title>
  <style>
    body {
      margin: 0;
      background: #000;
      overflow: hidden;
    }
    canvas {
      position: absolute;
      top: 0;
      left: 0;
    }
    #start {
      position: absolute;
      z-index: 10;
      top: 20px;
      left: 20px;
      padding: 12px 20px;
      font-size: 16px;
    }
  </style>
</head>
<body>

<button id="start">Start Camera</button>
<video id="video" autoplay playsinline muted></video>
<canvas id="canvas"></canvas>

<!-- ONNX Runtime -->
<script src="https://cdn.jsdelivr.net/npm/onnxruntime-web/dist/ort.min.js"></script>

<!-- Tesseract OCR -->
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

<script src="main.js"></script>
</body>
</html>
